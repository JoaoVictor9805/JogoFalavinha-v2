services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jogofalavinha_v2_frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:3001/api

  # Estrutura pronta para a 2a fase (desenvolvimento da API Node)
  # Para subir também o backend: docker compose --profile backend up -d
  backend:
    profiles:
      - backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jogofalavinha_v2_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - FRONTEND_ORIGIN=http://localhost:5174

volumes:
  frontend_node_modules:
  backend_node_modules:

